name: tests
on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - run: pytest -m "not ui"

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - run: python -m playwright install --with-deps chromium
      - name: Start app and run browser tests
        run: |
          uvicorn securedesk.main:app --host 127.0.0.1 --port 8000 &
          server_pid=$!
          trap "kill $server_pid" EXIT
          for attempt in {1..30}; do
            if curl --fail http://127.0.0.1:8000/api/health; then break; fi
            sleep 1
          done
          pytest -m ui
